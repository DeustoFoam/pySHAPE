name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[mesh,analysis,web,dev]"
      - run: python -m pytest -q tests
      - run: python -m build
      - name: Check installed wheel without optional dependencies
        shell: bash
        run: |
          python -m venv /tmp/pyshape-core
          /tmp/pyshape-core/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pyshape-core/bin/python -c 'import pyshape; assert pyshape.analyze_mesh([[0,0,0],[1,0,0],[0,1,0]], [[0,1,2]]).values["surface_area"] == 0.5'
