name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported version (current NumPy and SciPy require >= 3.12).
          - python: "3.12"
            install: ".[mesh,analysis,web,dev]"
          # Newest version with wheels for every optional dependency.
          - python: "3.14"
            install: ".[mesh,analysis,web,dev]"
          # Latest release. manifold3d has no 3.15 wheel yet, so the solid-union
          # backend is left out and its tests skip; everything else is tested.
          - python: "3.15"
            install: ".[analysis,dev] trimesh fastapi uvicorn python-multipart"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ${{ matrix.install }}
      - run: python -m pytest -q tests
      - run: python -m build
      - name: Check installed wheel without optional dependencies
        shell: bash
        run: |
          python -m venv /tmp/pyshape-core
          /tmp/pyshape-core/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pyshape-core/bin/python -c 'import pyshape; assert pyshape.analyze_mesh([[0,0,0],[1,0,0],[0,1,0]], [[0,1,2]]).values["surface_area"] == 0.5'
