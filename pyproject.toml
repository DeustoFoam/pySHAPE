[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshape"
dynamic = ["version"]
description = "Particle geometry, form, and surface roughness analysis (Python port of SHAPE)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
dependencies = ["numpy>=1.20"]
authors = [
    {name = "Lorenzo Pedrolli", email = "l.pedrolli@deusto.es"},
]
keywords = ["particle shape", "morphology", "sphericity", "form indices", "SHAPE", "DEM", "STL"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
mesh = ["trimesh>=4.5", "manifold3d>=3"]
analysis = ["scipy>=1.7"]
gui = ["matplotlib>=3.8", "trimesh>=4.5", "manifold3d>=3", "scipy>=1.7"]
web = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.18", "trimesh>=4.5", "manifold3d>=3"]
dev = ["pytest>=7", "httpx>=0.24", "build>=1"]

[project.urls]
Repository = "https://github.com/DeustoFoam/pySHAPE"
"Original SHAPE" = "https://github.com/vsangelidakis/SHAPE"

[project.scripts]
pyshape-gui = "pyshape.gui:main"
pyshape-web = "pyshape.web:main"

[tool.setuptools.dynamic]
version = {attr = "pyshape.__version__"}

[tool.setuptools.packages.find]
include = ["pyshape*"]

[tool.setuptools.package-data]
pyshape = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
