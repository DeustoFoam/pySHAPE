[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshape"
version = "0.1.0"
description = "Particle geometry, form, and surface roughness analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-only"}
dependencies = ["numpy>=1.20"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
mesh = ["trimesh>=4.5", "manifold3d>=3"]
analysis = ["scipy>=1.7"]
gui = ["matplotlib>=3.8", "trimesh>=4.5", "manifold3d>=3", "scipy>=1.7"]
web = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.18", "trimesh>=4.5", "manifold3d>=3"]
dev = ["pytest>=7", "httpx>=0.24", "build>=1"]

[project.urls]
Repository = "https://github.com/Lollum89/pySHAPE"

[project.scripts]
pyshape-gui = "pyshape.gui:main"
pyshape-web = "pyshape.web:main"

[tool.setuptools.packages.find]
include = ["pyshape*"]

[tool.setuptools.package-data]
pyshape = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
